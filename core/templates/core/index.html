<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calil Aceron — Portfolio</title>
  {% load static %}
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{% static 'css/portfolio.css' %}" />
</head>
<body class="bg-[#0a0a0a] text-white">
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel">{% verbatim %}
    const { useState, useEffect, useRef } = React;


    const GHIcon = ({ s = 20 }) => (
      <svg width={s} height={s} viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12 0C5.374 0 0 5.373 0 12c0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0 1 12 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12z"/>
      </svg>
    );

    const LIIcon = ({ s = 20 }) => (
      <svg width={s} height={s} viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
      </svg>
    );

    const BookOpenIcon = ({ s = 20 }) => (
      <svg width={s} height={s} viewBox="0 0 24 24" fill="none"
        stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round">
        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
        <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
      </svg>
    );

    const ExtLinkIcon = ({ s = 14 }) => (
      <svg width={s} height={s} viewBox="0 0 24 24" fill="none"
        stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
        <polyline points="15 3 21 3 21 9"/>
        <line x1="10" y1="14" x2="21" y2="3"/>
      </svg>
    );

    const useTyper = (words, speed = 78, pause = 2400) => {
      const [s, setS] = useState({ i: 0, c: 0, del: false });
      useEffect(() => {
        const w = words[s.i];
        let t;
        if      (!s.del && s.c < w.length)  t = setTimeout(() => setS(p => ({ ...p, c: p.c + 1 })), speed);
        else if (!s.del && s.c === w.length) t = setTimeout(() => setS(p => ({ ...p, del: true })), pause);
        else if (s.del && s.c > 0)           t = setTimeout(() => setS(p => ({ ...p, c: p.c - 1 })), speed / 2);
        else                                  setS({ i: (s.i + 1) % words.length, c: 0, del: false });
        return () => clearTimeout(t);
      }, [s]);
      return words[s.i].slice(0, s.c);
    };

    const Reveal = ({ children, delay = 0, className = '' }) => {
      const ref = useRef();
      useEffect(() => {
        const el = ref.current;
        if (!el) return;
        const ob = new IntersectionObserver(
          ([e]) => { if (e.isIntersecting) { el.classList.add('in'); ob.disconnect(); } },
          { threshold: 0.07 }
        );
        ob.observe(el);
        return () => ob.disconnect();
      }, []);
      return (
        <div ref={ref} className={`reveal ${className}`} style={{ transitionDelay: `${delay}ms` }}>
          {children}
        </div>
      );
    };

    const scrollTo = id => {
      const el = document.getElementById(id);
      if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 72, behavior: 'smooth' });
    };

    const SH = ({ label, title }) => (
      <div className="mb-12">
        <p className="text-blue-500 text-[11px] font-bold tracking-[0.22em] uppercase mb-2">{label}</p>
        <h2 className="text-3xl md:text-[2.6rem] font-bold text-white" style={{ letterSpacing: '-0.025em' }}>{title}</h2>
        <div className="mt-4 h-0.5 w-10 bg-blue-600 rounded-full"></div>
      </div>
    );

    const Nav = () => {
      const [sc, setSc] = useState(false);
      const [open, setOpen] = useState(false);
      useEffect(() => {
        const fn = () => setSc(window.scrollY > 24);
        window.addEventListener('scroll', fn, { passive: true });
        return () => window.removeEventListener('scroll', fn);
      }, []);
      const links = ['About', 'Skills', 'Projects', 'Publications', 'Contact'];
      return (
        <header className={`fixed top-0 inset-x-0 z-50 transition-all duration-300 ${sc ? 'bg-[#0a0a0a]/82 backdrop-blur-2xl border-b border-white/[0.06]' : ''}`}>
          <div className="max-w-5xl mx-auto px-6 flex items-center justify-between h-[68px]">
            <button
              onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })}
              className="text-white font-bold text-lg bg-transparent border-0 cursor-pointer p-0 hover:opacity-70 transition-opacity"
              style={{ letterSpacing: '-0.03em' }}>
              <span className="text-blue-500">C</span>alil<span className="text-blue-500">.</span>
            </button>
            <nav className="hidden md:flex items-center gap-8">
              {links.map(l => (
                <a key={l} href={`#${l.toLowerCase()}`}
                  className="text-sm text-slate-400 hover:text-white font-medium transition-colors duration-200 no-underline" style={{ textDecoration: 'none' }}>
                  {l}
                </a>
              ))}
            </nav>
            <button
              className="md:hidden text-slate-400 hover:text-white bg-transparent border-0 cursor-pointer p-1 -mr-1 transition-colors"
              onClick={() => setOpen(o => !o)} aria-label="Toggle menu">
              {open
                ? <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                : <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>}
            </button>
          </div>
          {open && (
            <div className="md:hidden border-t border-white/[0.05] px-6 py-5 flex flex-col gap-5"
              style={{ background: 'rgba(10,14,26,0.97)', backdropFilter: 'blur(24px)' }}>
              {links.map(l => (
                <a key={l} href={`#${l.toLowerCase()}`} onClick={() => setOpen(false)}
                  className="text-slate-400 hover:text-white text-sm font-medium transition-colors" style={{ textDecoration: 'none' }}>
                  {l}
                </a>
              ))}
            </div>
          )}
        </header>
      );
    };

    const Hero = () => {
      const typed = useTyper([
        'CS Student @ ADMU',
        'Aspiring Software Engineer',
        'Enterprise Systems Specialization',
        'Web Developer',
      ]);
      return (
        <section id="home" className="relative min-h-screen flex flex-col items-center justify-center text-center px-6 pt-16 overflow-hidden">
          <div className="pointer-events-none absolute inset-0" aria-hidden="true">
            <div style={{ position:'absolute', top:'42%', left:'50%', transform:'translate(-50%,-50%)', width:800, height:800, background:'radial-gradient(circle, rgba(59,130,246,0.052) 0%, transparent 62%)' }}></div>
          </div>
          <p className="au d1 text-[11px] font-bold tracking-[0.24em] uppercase text-blue-500 mb-6">Hello, Kumusta, Bonjour</p>
          <h1 className="au d2 font-extrabold text-white leading-none mb-4"
            style={{ fontSize: 'clamp(2.8rem, 8vw, 5.5rem)', letterSpacing: '-0.038em' }}>
            I'm{' '}
            <span className="text-blue-500" style={{ textShadow: '0 0 64px rgba(59,130,246,0.35)' }}>Calil.</span>
          </h1>
          <div className="au d3 text-lg sm:text-xl text-slate-400 font-medium mb-4 h-8 flex items-center justify-center gap-1">
            <span>{typed}</span>
            <span className="cursor text-blue-400 ml-0.5">|</span>
          </div>
          <p className="au d4 text-slate-500 text-[15px] max-w-[380px] leading-relaxed mb-10">
            Understanding, learning, and growing as a software engineer.
          </p>
          <div className="au d5 flex flex-wrap items-center justify-center gap-3">
            <a href="https://github.com/calilaceron" target="_blank" rel="noopener noreferrer"
              className="bg-blue-600 hover:bg-blue-500 text-white font-semibold text-sm px-6 py-3 rounded-xl transition-all duration-200 hover:-translate-y-0.5 cursor-pointer inline-block"
              style={{ textDecoration: 'none' }}
              onMouseEnter={e => e.currentTarget.style.boxShadow = '0 8px 32px -4px rgba(59,130,246,0.45)'}
              onMouseLeave={e => e.currentTarget.style.boxShadow = 'none'}>
              View My Work
            </a>
          </div>
          <button onClick={() => scrollTo('about')}
            className="absolute bottom-10 left-1/2 -translate-x-1/2 flex flex-col items-center gap-1.5 text-slate-700 hover:text-slate-500 transition-colors bg-transparent border-0 cursor-pointer">
            <span className="text-[10px] font-bold tracking-[0.2em] uppercase">Scroll</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </button>
        </section>
      );
    };

    const About = () => (
      <section id="about" className="py-28 px-6">
        <div className="max-w-5xl mx-auto">
          <Reveal><SH label="Who I Am" title="About Me" /></Reveal>
          <div className="grid md:grid-cols-5 gap-10 md:gap-14 items-start">
            <Reveal delay={80} className="md:col-span-3">
              <p className="text-slate-300 leading-[1.85] mb-5 text-[15px]">
                I'm a 3rd year Computer Science student at{' '}
                <span className="text-white font-semibold">Ateneo de Manila University</span>,
                specializing in Enterprise Systems. I'm excited about exploring my skills
                in software engineering, databases, and web frameworks, as well as UI, UX, and front-end designs by constantly pushing
                myself to learn new technologies beyond the classroom.
              </p>
              <p className="text-slate-400 leading-[1.85] text-[15px]">
                I look forward to working in teams to build projects that solve meaningful
                technical problems and benefit society. Whether it's full-stack web development,
                intuitive UI design, or team collaboration, I'm eager to contribute,
                collaborate, and grow.
              </p>
            </Reveal>
            <Reveal delay={150} className="md:col-span-2">
              <div className="grid grid-cols-2 gap-3">
                {[
                  ['University', 'Ateneo de Manila'],
                  ['Year', '3rd Year'],
                  ['Specialization', 'Enterprise Systems'],
                  ['Degree', 'B.S. Computer Science'],
                  ['Location', 'Philippines'],
                  ['Status', 'Studying'],
                ].map(([label, value]) => (
                  <div key={label} className="bg-slate-900/60 border border-white/[0.06] rounded-xl p-4 transition-all duration-300 hover:border-blue-500/[0.28] hover:shadow-[0_0_22px_-4px_rgba(59,130,246,0.22)] hover:-translate-y-0.5">
                    <p className="text-slate-600 text-[10px] font-bold uppercase tracking-widest mb-1.5">{label}</p>
                    <p className="text-white text-sm font-medium">{value}</p>
                  </div>
                ))}
              </div>
            </Reveal>
          </div>
        </div>
      </section>
    );

    const Skills = ({ skills }) => {
      if (!skills) return null;
      return (
        <section id="skills" className="py-28 px-6" style={{ background: 'rgba(15,23,42,0.28)' }}>
          <div className="max-w-5xl mx-auto">
            <Reveal><SH label="What I Know" title="Skills" /></Reveal>
            <div className="grid sm:grid-cols-2 gap-5">
              {Object.entries(skills).map(([cat, items], i) => (
                <Reveal key={cat} delay={i * 80}>
                  <div className="bg-slate-900/50 border border-white/[0.06] rounded-2xl p-6">
                    <h3 className="text-white text-[11px] font-bold uppercase tracking-[0.16em] mb-4">{cat}</h3>
                    <div className="flex flex-wrap gap-2">
                      {items.map(sk => <span key={sk} className="pill">{sk}</span>)}
                    </div>
                  </div>
                </Reveal>
              ))}
            </div>
          </div>
        </section>
      );
    };

    const Card = ({ p, delay }) => (
      <Reveal delay={delay} className="flex flex-col">
        <div className="p-card flex-1 flex flex-col gap-4 p-6 rounded-2xl" style={{ background: 'rgba(13,20,38,0.7)' }}>
          <div className="flex items-start justify-between">
            <svg className="folder-ic" width="26" height="26" viewBox="0 0 24 24" fill="none"
              stroke="#3d5070" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
              <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
            </svg>
            <div className="flex items-center gap-3">
              {p.github_url && (
                <a href={p.github_url} target="_blank" rel="noopener noreferrer" className="gh-link">
                  <GHIcon s={17} />
                </a>
              )}
              {p.live_url && (
                <a href={p.live_url} target="_blank" rel="noopener noreferrer" className="gh-link" title="Live Demo">
                  <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
                    <polyline points="15 3 21 3 21 9"/>
                    <line x1="10" y1="14" x2="21" y2="3"/>
                  </svg>
                </a>
              )}
            </div>
          </div>
          <div className="flex-1">
            <h3 className="text-white font-semibold mb-2 text-[15px]" style={{ letterSpacing: '-0.01em' }}>{p.title}</h3>
            <p className="text-slate-400 text-sm leading-relaxed">{p.description}</p>
          </div>
          <div className="flex flex-wrap gap-2">
            {(p.tech_stack || []).map(t => <span key={t} className="s-tag">{t}</span>)}
          </div>
        </div>
      </Reveal>
    );

    const Publications = ({ publications }) => {
      if (!publications || publications.length === 0) return null;
      return (
        <section id="publications" className="py-28 px-6" style={{ background: 'rgba(15,23,42,0.28)' }}>
          <div className="max-w-5xl mx-auto">
            <Reveal><SH label="Research" title="Publications" /></Reveal>
            <div className="flex flex-col gap-5">
              {publications.map((pub, i) => (
                <Reveal key={pub.title} delay={i * 80}>
                  <div className="p-card flex flex-col gap-5 p-7 rounded-2xl" style={{ background: 'rgba(13,20,38,0.7)' }}>

                    <div className="flex items-start justify-between gap-3 flex-wrap">
                      <div className="flex items-center gap-2.5">
                        <span className="text-blue-400/60 shrink-0"><BookOpenIcon s={20} /></span>
                        <span className="text-[11px] font-bold tracking-[0.13em] uppercase text-blue-400 bg-blue-500/[0.1] border border-blue-500/[0.2] px-2.5 py-1 rounded-full leading-tight">
                          {pub.role}
                        </span>
                      </div>
                      <span className="text-slate-500 text-xs font-semibold tracking-wide shrink-0">{pub.year}</span>
                    </div>

                    <div>
                      <h3 className="text-white font-semibold text-[15px] leading-snug mb-1.5" style={{ letterSpacing: '-0.01em' }}>
                        {pub.title}
                      </h3>
                      <p className="text-slate-400 text-sm mb-3">{pub.journal}</p>
                      {pub.metrics && (
                        <div className="flex flex-wrap gap-2">
                          {pub.metrics.split('|').map(m => (
                            <span key={m} className="text-[11px] font-medium text-slate-300 bg-slate-800/80 border border-white/[0.07] px-2.5 py-1 rounded-md">
                              {m.trim()}
                            </span>
                          ))}
                        </div>
                      )}
                    </div>

                    {pub.description && pub.description.length > 0 && (
                      <ul className="flex flex-col gap-2.5 border-t border-white/[0.05] pt-4">
                        {pub.description.map((point, j) => (
                          <li key={j} className="flex items-start gap-2.5 text-sm text-slate-400 leading-relaxed">
                            <svg className="shrink-0 mt-[7px]" width="5" height="5" viewBox="0 0 6 6" fill="rgba(59,130,246,0.7)">
                              <circle cx="3" cy="3" r="3"/>
                            </svg>
                            {point}
                          </li>
                        ))}
                      </ul>
                    )}

                    {pub.link && (
                      <div className="pt-2 border-t border-white/[0.05] flex justify-end">
                        <a href={pub.link} target="_blank" rel="noopener noreferrer"
                          className="inline-flex items-center gap-1.5 text-sm font-medium text-blue-400 hover:text-blue-300 transition-colors duration-200"
                          style={{ textDecoration: 'none' }}>
                          View Publication <ExtLinkIcon s={13} />
                        </a>
                      </div>
                    )}

                  </div>
                </Reveal>
              ))}
            </div>
          </div>
        </section>
      );
    };

    const Projects = ({ projects }) => {
      if (!projects) return null;
      return (
      <section id="projects" className="py-28 px-6">
        <div className="max-w-5xl mx-auto">
          <Reveal><SH label="What I've Built" title="Projects" /></Reveal>
          <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-5">
            {projects.map((p, i) => <Card key={p.title} p={p} delay={i * 60} />)}
          </div>
          <Reveal delay={220}>
            <div className="mt-10 text-center">
              <a href="https://github.com/calilaceron" target="_blank" rel="noopener noreferrer"
                className="inline-flex items-center gap-2 text-sm text-blue-400 hover:text-blue-300 font-medium transition-colors duration-200"
                style={{ textDecoration: 'none' }}>
                View all on GitHub
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
                  <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
                  <polyline points="15 3 21 3 21 9"/>
                  <line x1="10" y1="14" x2="21" y2="3"/>
                </svg>
              </a>
            </div>
          </Reveal>
        </div>
      </section>
      );
    };

    const Contact = () => (
      <section id="contact" className="py-28 px-6" style={{ background: 'rgba(15,23,42,0.28)' }}>
        <div className="max-w-5xl mx-auto">
          <Reveal><SH label="Get In Touch" title="Let's Connect." /></Reveal>
          <div className="grid md:grid-cols-2 gap-14 items-center">
            <Reveal delay={80}>
              <p className="text-slate-300 leading-[1.85] mb-8 text-[15px]">
                I'm currently in my third year of studies, but am open to internship opportunities, so feel free to reach out and I'll get back to you soon!
              </p>
              <a href="mailto:calilaceron11@gmail.com" className="email-lnk text-[15px]">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
                  <rect x="2" y="4" width="20" height="16" rx="2"/>
                  <path d="m2 7 10 7 10-7"/>
                </svg>
                calilaceron11@gmail.com
              </a>
            </Reveal>
            <Reveal delay={150}>
              <div className="flex gap-3 md:justify-end">
                <a href="https://github.com/calilaceron" target="_blank" rel="noopener noreferrer" className="soc-btn">
                  <GHIcon s={17} /> GitHub
                </a>
                <a href="https://www.linkedin.com/in/calilaceron" target="_blank" rel="noopener noreferrer" className="soc-btn">
                  <LIIcon s={17} /> LinkedIn
                </a>
                <button onClick={() => alert('Resume is issued upon request. Email me at calilaceron11@gmail.com')} className="soc-btn">
                  <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="7 10 12 15 17 10"/>
                    <line x1="12" y1="15" x2="12" y2="3"/>
                  </svg>
                  Resume
                </button>
              </div>
            </Reveal>
          </div>
        </div>
      </section>
    );

    const ScrollTop = () => {
      const [visible, setVisible] = useState(false);
      useEffect(() => {
        const fn = () => setVisible(window.scrollY > 300);
        window.addEventListener('scroll', fn, { passive: true });
        return () => window.removeEventListener('scroll', fn);
      }, []);
      if (!visible) return null;
      return (
        <a
          href="#home"
          aria-label="Back to top"
          style={{
            position: 'fixed',
